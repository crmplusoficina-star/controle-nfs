name: Corrigir identidade segura do inventário

on:
  push:
    branches:
      - fix/inventario-identidade-segura
    paths:
      - scripts/fix-inventory-safe-identity.py
      - .github/workflows/apply-inventory-safe-identity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventario-identidade-segura

      - name: Aplicar correção
        run: python scripts/fix-inventory-safe-identity.py

      - name: Validar diff
        run: |
          git diff --check
          git diff -- app/api/ai/inventory-fast/route.ts components/inventory/PhotoInventoryRapid.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/ai/inventory-fast/route.ts components/inventory/PhotoInventoryRapid.tsx
          git commit -m "fix: impedir sobrescrita de ferramentas no inventário"
          git push
