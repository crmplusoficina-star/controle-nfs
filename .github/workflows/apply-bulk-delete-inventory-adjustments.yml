name: Aplicar exclusão em massa no inventário

on:
  push:
    branches:
      - fix/bulk-delete-inventory-adjustments

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bulk-delete-inventory-adjustments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/patch-bulk-delete-inventory-adjustments.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/inventory/adjustments/page.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: permitir exclusão em massa no inventário"
            git push
          fi
