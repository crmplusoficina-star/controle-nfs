name: Aplicar busca global do estoque

on:
  push:
    branches:
      - feat/busca-global-estoque
    paths:
      - .github/workflows/patch-global-stock-search.yml
      - scripts/patch-global-stock-search.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/busca-global-estoque
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar patch
        run: node scripts/patch-global-stock-search.mjs
      - name: Commitar página alterada
        run: |
          if git diff --quiet -- app/dashboard/stock/page.tsx; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/stock/page.tsx
          git commit -m "feat: busca global de ferramentas por código"
          git push origin HEAD:feat/busca-global-estoque
