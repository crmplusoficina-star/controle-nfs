name: Limpar correção final de fotos

on:
  push:
    branches:
      - fix/inventario-foto-principal-inteira-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventario-foto-principal-inteira-v2
      - name: Remover temporários
        run: |
          rm -f scripts/patch-inventory-full-latest-photo-v2.py
          rm -f .github/workflows/apply-inventory-full-latest-photo-v2.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover temporários da correção final de fotos"
          git push
